group = "io.anyline.tiretread.flutter"
version = "1.0-SNAPSHOT"

buildscript {
    ext{
        kotlin_version = "2.0.21"
        tiretread_sdk_version = '15.3.3-rc.1'
    }
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.2.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
        classpath("org.jetbrains.kotlin:kotlin-serialization:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // Anyline Maven registry
        maven { url "https://europe-maven.pkg.dev/anyline-ttr-sdk/release-candidates" }
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "kotlinx-serialization"

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "io.anyline.tiretread.flutter"
    }

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 23
    }

    dependencies {
        implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3")

        // Anyline Tire Tread SDK dependency
        implementation("io.anyline.tiretread.sdk:shared-android:$tiretread_sdk_version")

        // Coroutines — used by the sidewall plugin's suspend isSupported() call.
        // The SDK depends on coroutines transitively but only at runtime scope,
        // so declare it explicitly for compilation. Matches the SDK's version.
        implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0")

        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.5.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
